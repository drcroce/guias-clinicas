<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Biblioteca Médica Personal Croce</title>
<link rel="stylesheet" href="assets/croce.css">
<style>
.page{max-width:980px;margin:0 auto;padding:18px}
.header{background:linear-gradient(135deg,var(--brand),var(--brand2));color:white;border-radius:18px;padding:26px 22px;margin-bottom:16px;box-shadow:var(--shadow)}
.header h1{margin:0 0 6px;font-size:25px}.header p{margin:0;color:rgba(255,255,255,.84);font-size:14px}
.stats{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}.stat{background:rgba(255,255,255,.16);border-radius:999px;padding:5px 11px;font-size:12px}
.toolbar{display:grid;grid-template-columns:1fr 220px;gap:10px;margin:16px 0}.search,.filter{border:1px solid var(--border);border-radius:12px;background:white;padding:12px 14px;font-size:14px;outline:none}
.category-title{font-size:12px;text-transform:uppercase;letter-spacing:.7px;color:#827c73;font-weight:800;margin:22px 4px 10px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(270px,1fr));gap:12px}
.card{background:white;border:1px solid transparent;border-radius:16px;padding:16px;box-shadow:var(--shadow);transition:.15s;display:flex;gap:12px;align-items:flex-start;min-height:118px}
.card:hover{transform:translateY(-1px);border-color:rgba(143,47,37,.28)}.icon{font-size:28px;width:46px;height:46px;border-radius:12px;background:#f7eee9;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.title{font-weight:750;font-size:15px;margin-bottom:4px}.sub{font-size:13px;color:var(--muted);line-height:1.4;margin-bottom:9px}.tags{display:flex;gap:6px;flex-wrap:wrap}.tag{font-size:11px;padding:3px 8px;border-radius:999px;background:#f4f1ec;color:#666}
.empty{display:none;text-align:center;color:var(--muted);padding:34px;background:white;border-radius:16px;box-shadow:var(--shadow)}.footer{text-align:center;color:#999;font-size:12px;margin:24px 0}
@media(max-width:620px){.toolbar{grid-template-columns:1fr}.header h1{font-size:21px}.page{padding:12px}}
</style>
</head>
<body>
<div class="page">
<header class="header">
  <h1>Biblioteca Médica Personal Croce</h1>
  <p>Guías clínicas interactivas para consulta y estudio personal</p>
  <div class="stats"><span class="stat" id="totalGuias">13 guías</span><span class="stat">Uso personal</span><span class="stat">HTML independiente</span></div>
</header>
<div class="toolbar">
  <input id="search" class="search" type="search" placeholder="Buscar guía..." oninput="renderGuias()">
  <select id="category" class="filter" onchange="renderGuias()"><option value="">Todas las categorías</option></select>
</div>
<main id="content"></main>
<div id="empty" class="empty">No se encontraron guías.</div>
<footer class="footer">Dr. Luis E. Croce A. · Biblioteca médica personal</footer>
</div>
<script>
const GUIAS = [
  {
    "titulo": "CAD / EHH — Crisis Hiperglucémica",
    "subtitulo": "Cetoacidosis diabética · Estado hiperosmolar",
    "archivo": "guias/cad_ehh.html",
    "categoria": "Endocrinología",
    "icono": "⚡",
    "tags": [
      "ADA",
      "Urgencias"
    ]
  },
  {
    "titulo": "Hipoglucemia — Manejo en Urgencias",
    "subtitulo": "Diagnóstico, clasificación y tratamiento",
    "archivo": "guias/Hipoglucemia_DrCroce_2026.html",
    "categoria": "Endocrinología",
    "icono": "🩸",
    "tags": [
      "ADA",
      "Urgencias"
    ]
  },
  {
    "titulo": "Exacerbación de EPOC (AECOPD)",
    "subtitulo": "Diagnóstico, severidad y tratamiento",
    "archivo": "guias/AECOPD_Modulo_Croce_v2.html",
    "categoria": "Neumología",
    "icono": "🫁",
    "tags": [
      "GOLD",
      "Urgencias"
    ]
  },
  {
    "titulo": "Espirometría — Interpretación Práctica",
    "subtitulo": "Patrones obstructivos, restrictivos y mixtos",
    "archivo": "guias/espirometria_DrCroce_2026.html",
    "categoria": "Neumología",
    "icono": "🌬️",
    "tags": [
      "ATS/ERS",
      "Medicina Interna"
    ]
  },
  {
    "titulo": "Neumonía Adquirida en la Comunidad",
    "subtitulo": "CURB-65 · antibióticos · UCI · poblaciones especiales",
    "archivo": "guias/neumonia_adquirida_comunidad_DrCroce.html",
    "categoria": "Neumología",
    "icono": "🫁",
    "tags": [
      "ATS/IDSA",
      "Urgencias"
    ]
  },
  {
    "titulo": "Gasometría y Trastornos Ácido-Base",
    "subtitulo": "Interpretación sistemática y casos clínicos",
    "archivo": "guias/gasometria_acido_base.html",
    "categoria": "Medicina Interna",
    "icono": "🫧",
    "tags": [
      "Ácido-base",
      "Urgencias"
    ]
  },
  {
    "titulo": "Sepsis y Shock Séptico",
    "subtitulo": "Manejo en urgencias y hospitalización",
    "archivo": "guias/sepsis-choque-septico.html",
    "categoria": "Infectología",
    "icono": "🦠",
    "tags": [
      "SSC",
      "UCI"
    ]
  },
  {
    "titulo": "Dengue — Abordaje Clínico Integral",
    "subtitulo": "Estadios · emergencia · complicaciones · shock",
    "archivo": "guias/dengue.html",
    "categoria": "Infectología",
    "icono": "🦟",
    "tags": [
      "OPS/OMS",
      "Urgencias"
    ]
  },
  {
    "titulo": "Infección del Tracto Urinario (ITU)",
    "subtitulo": "ITU no complicada · pielonefritis · ITU complicada · urosepsis",
    "archivo": "guias/itu_adulto_DrCroce_2026.html",
    "categoria": "Infectología",
    "icono": "🦠",
    "tags": [
      "IDSA",
      "EAU",
      "Urgencias"
    ]
  },
  {
    "titulo": "Síndrome Coronario Agudo (SCA)",
    "subtitulo": "STEMI · NSTEMI · angina inestable · antitrombóticos",
    "archivo": "guias/SCA_DrCroce_2026.html",
    "categoria": "Cardiología",
    "icono": "❤️‍🔥",
    "tags": [
      "ESC",
      "ACC/AHA",
      "Urgencias"
    ]
  },
  {
    "titulo": "Insuficiencia Cardíaca Aguda y Crónica",
    "subtitulo": "GDMT · IC descompensada · HFrEF / HFpEF",
    "archivo": "guias/insuficiencia_cardiaca_DrCroce.html",
    "categoria": "Cardiología",
    "icono": "🫀",
    "tags": [
      "ESC",
      "AHA/ACC"
    ]
  },
  {
    "titulo": "Emergencia Hipertensiva",
    "subtitulo": "Diagnóstico · estratificación · manejo por órgano diana",
    "archivo": "guias/emergenciahipertensiva.html",
    "categoria": "Cardiología",
    "icono": "🫀",
    "tags": [
      "ESC",
      "AHA/ACC",
      "Urgencias"
    ]
  },
  {
    "titulo": "ACV Isquémico Agudo",
    "subtitulo": "Trombólisis · trombectomía · NIHSS · prevención",
    "archivo": "guias/acv_isquemico_DrCroce.html",
    "categoria": "Neurología",
    "icono": "🧠",
    "tags": [
      "AHA/ASA",
      "Urgencias"
    ]
  }
];
function initCategorias(){
  document.getElementById('totalGuias').textContent = GUIAS.length + ' guías';
  const select=document.getElementById('category');
  [...new Set(GUIAS.map(g=>g.categoria))].sort().forEach(cat=>{const opt=document.createElement('option'); opt.value=cat; opt.textContent=cat; select.appendChild(opt);});
}
function cardHTML(g){return `<a class="card" href="${g.archivo}"><div class="icon">${g.icono}</div><div><div class="title">${g.titulo}</div><div class="sub">${g.subtitulo}</div><div class="tags"><span class="tag">${g.categoria}</span>${g.tags.map(t=>`<span class="tag">${t}</span>`).join('')}</div></div></a>`}
function renderGuias(){
  const q=document.getElementById('search').value.toLowerCase().trim(); const cat=document.getElementById('category').value; const content=document.getElementById('content'); const empty=document.getElementById('empty'); content.innerHTML='';
  const filtered=GUIAS.filter(g=>{const text=[g.titulo,g.subtitulo,g.categoria,...g.tags].join(' ').toLowerCase(); return (!q||text.includes(q))&&(!cat||g.categoria===cat);});
  const groups={}; filtered.forEach(g=>{(groups[g.categoria] ||= []).push(g);});
  Object.keys(groups).sort().forEach(c=>{const h=document.createElement('div'); h.className='category-title'; h.textContent=c; const grid=document.createElement('div'); grid.className='grid'; groups[c].forEach(g=>grid.insertAdjacentHTML('beforeend',cardHTML(g))); content.appendChild(h); content.appendChild(grid);});
  empty.style.display=filtered.length?'none':'block';
}
initCategorias();renderGuias();
</script>
<script src="assets/croce.js"></script>
</body>
</html>
